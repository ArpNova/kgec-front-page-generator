<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Signature Extractor - KGEC Pages</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="page-signature">
  <div id="navbar-root"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Signature Extractor</h1>
      <a href="../index.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <p class="text-muted">Pick a photo or scan of a signature. The ink is extracted with a transparent background, and you choose the crop and the ink colour. Everything runs in your browser.</p>

    <button id="btn-choose" class="btn btn-primary mb-4"><i class="bi bi-pen"></i> Choose signature</button>

    <div id="results" class="row g-3"></div>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./index.js"></script>
</html>
