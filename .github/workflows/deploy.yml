name: Test and deploy

on:
  push:
    branches: [main]
    # A merged version-bump PR only ever touches this one file — skip
    # re-triggering the workflow for it to avoid an infinite deploy loop.
    paths-ignore:
      - 'assets/config/version.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

# Only one Pages deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version metadata
        run: |
          BUILD_NUM="${{ github.run_number }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:6}"
          UPDATE_DATE="$(date -u +'%d %b %Y')"
          ISO_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          VERSION="v2.0.${BUILD_NUM}"

          mkdir -p assets/config
          cat <<EOF > assets/config/version.json
          {
            "repoUrl": "${{ github.server_url }}/${{ github.repository }}",
            "version": "${VERSION}",
            "buildNumber": ${BUILD_NUM},
            "commitHash": "${SHORT_SHA}",
            "updatedDate": "${UPDATE_DATE}",
            "isoDate": "${ISO_DATE}"
          }
          EOF

          echo "Generated version metadata: ${VERSION} (${SHORT_SHA})"

          {
            echo "VERSION=${VERSION}"
            echo "SHORT_SHA=${SHORT_SHA}"
            echo "UPDATE_DATE=${UPDATE_DATE}"
            echo "BUILD_NUM=${BUILD_NUM}"
          } >> "$GITHUB_ENV"

      - name: Create Git tag and release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${VERSION}" -m "Release ${VERSION} - Deployment #${BUILD_NUM}"
          git push origin "${VERSION}"

          gh release create "${VERSION}" \
            --title "Release ${VERSION} (${UPDATE_DATE})" \
            --notes "Automated deployment (Build #${BUILD_NUM}, Commit ${SHORT_SHA})"

      - name: Stage site (exclude dev-only files)
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='_site' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Open version bump PR
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- assets/config/version.json; then
            echo "No version.json changes to commit."
            exit 0
          fi

          BOT_BRANCH="chore/version-bump-${BUILD_NUM}"
          git checkout -B "$BOT_BRANCH"
          git add assets/config/version.json
          git commit -m "chore: bump deployed version to ${VERSION}"
          git push origin "$BOT_BRANCH"

          gh pr create \
            --base main \
            --head "$BOT_BRANCH" \
            --title "chore: bump deployed version to ${VERSION}" \
            --body "Automated version bump for deploy #${BUILD_NUM} (commit ${SHORT_SHA})."

          gh pr merge "$BOT_BRANCH" --auto --squash
