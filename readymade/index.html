<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Readymade Pages - KGEC Pages</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="page-readymade">
  <div id="navbar-root"></div>

  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Readymade Pages</h1>
      <a href="../index.html" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back</a>
    </div>

    <div class="card">
      <div class="card-header"><i class="bi bi-mortarboard"></i> BEE Lab for CSE Students</div>
      <div class="card-body">
        <div class="list-group list-group-flush">
          <div class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span><i class="bi bi-file-earmark-pdf text-danger"></i> Index Page</span>
            <a href="./files/bee-lab-cse/index-page.pdf" download class="btn btn-sm btn-outline-primary">
              <i class="bi bi-download"></i> Download
            </a>
          </div>
          <div class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span><i class="bi bi-file-earmark-pdf text-danger"></i> Report Page</span>
            <a href="./files/bee-lab-cse/report-page.pdf" download class="btn btn-sm btn-outline-primary">
              <i class="bi bi-download"></i> Download
            </a>
          </div>
          <div class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span><i class="bi bi-file-earmark-pdf text-danger"></i> Writing Page</span>
            <a href="./files/bee-lab-cse/writing-page.pdf" download class="btn btn-sm btn-outline-primary">
              <i class="bi bi-download"></i> Download
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./index.js"></script>
</html>
